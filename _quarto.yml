lang: es

project:
  type: website
  output-dir: _site

website:
  title: "Investigaciones en GRD | SCR-UNGRD"
  site-url: https://scr-ungrd.github.io/investigaciones-grd-colombia
  favicon: images/favicon.png
  open-graph:
    title: "Portal de Investigaciones en Gestión del Riesgo · UNGRD"
    description: >
      Colección de publicaciones científicas y técnicas sobre gestión del riesgo
      de desastres en Colombia, elaboradas por la UNGRD.

  # Buscador como campo de texto en la barra (igual que Cuadernos Reproducibles y el HUB)
  search:
    type: textbox

  # Barra de navegación institucional (modelo: Cuadernos Reproducibles):
  # firma UNGRD en blanco | nombre del proyecto en dos líneas, secciones, íconos, buscador y tema.
  navbar:
    logo: images/logo-ungrd-blanco.svg
    logo-alt: "UNGRD - Unidad Nacional para la Gestión del Riesgo de Desastres"
    title: "Investigaciones en GRD"
    background: "#213362"
    foreground: "#ffffff"
    pinned: true
    left:
      - text: "Instrucciones para autores"
        href: instrucciones-autor.qmd
      - text: "Acerca de"
        href: acerca-de.qmd
    right:
      - icon: diagram-3-fill
        href: "https://scr-ungrd.github.io/hub/"
        aria-label: "HUB SCR — portal de proyectos"
        target: _blank
        rel: noopener noreferrer
      - icon: github
        href: https://github.com/scr-ungrd/investigaciones-grd-colombia
        aria-label: "Repositorio en GitHub"
        target: _blank
        rel: noopener noreferrer
      - icon: translate
        href: "https://translate.google.com/translate?sl=es&tl=en&u=https://scr-ungrd.github.io/investigaciones-grd-colombia/"
        aria-label: "Translate to English"
        target: _blank
        rel: noopener noreferrer

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    page-layout: full
    include-after-body: _footer.html
