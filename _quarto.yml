project:
  type: website
  output-dir: _site

website:
  title: "Investigaciones GRD | UNGRD"
  site-url: https://scr-ungrd.github.io/investigaciones-grd-colombia
  favicon: images/favicon.png
  open-graph:
    title: "Portal de Investigaciones en Gestión del Riesgo · UNGRD"
    description: >
      Colección de publicaciones científicas y técnicas sobre gestión del riesgo
      de desastres en Colombia, elaboradas por la UNGRD.

  navbar:
    logo: images/logo-ungrd.png
    logo-alt: "Logo UNGRD"
    background: "#232A60"
    foreground: white
    pinned: true
    right:
      - icon: house-fill
        href: index.qmd
        aria-label: Inicio
      - text: "La Colección"
        href: "#coleccion"
      - text: "Capítulos"
        href: "#capitulos"
      - text: "Otras publicaciones"
        href: "#otras"

  page-footer:
    background: "#1A2050"
    foreground: white
    left: "© 2026 UNGRD — Unidad Nacional para la Gestión del Riesgo de Desastres"
    center: "Subdirección de Conocimiento del Riesgo"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    page-layout: full
