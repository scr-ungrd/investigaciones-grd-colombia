project:
  type: website
  output-dir: _site

website:
  title: "Investigaciones en GRD | SCR-UNGRD"
  site-url: https://scr-ungrd.github.io/investigaciones-grd-colombia
  favicon: images/favicon.png
  open-graph:
    title: "Portal de Investigaciones en Gestión del Riesgo · UNGRD"
    description: >
      Colección de publicaciones científicas y técnicas sobre gestión del riesgo
      de desastres en Colombia, elaboradas por la UNGRD.

  navbar:
    logo: images/logo-ungrd.png
    logo-alt: "Logo UNGRD"
    background: light
    foreground: dark
    pinned: true
    right:
      - icon: diagram-3-fill
        href: "https://scr-ungrd.github.io/hub/"
        aria-label: "HUB SCR — portal de proyectos"
        target: _blank
        rel: noopener noreferrer
      - text: "Capítulos"
        href: "#capitulos"
      - text: "Otras publicaciones"
        href: "#otras"
      - text: "Acerca de esta serie"
        href: acerca-de.qmd
      - icon: github
        href: https://github.com/scr-ungrd/investigaciones-grd-colombia
        aria-label: "Repositorio en GitHub"
        target: _blank
        rel: noopener noreferrer
      - icon: translate
        href: "https://translate.google.com/translate?sl=es&tl=en&u=https://scr-ungrd.github.io/investigaciones-grd-colombia/"
        aria-label: "Translate to English"
        target: _blank
        rel: noopener noreferrer

  page-footer:
    background: "#1A2050"
    foreground: white
    left: "© 2026 UNGRD — Unidad Nacional para la Gestión del Riesgo de Desastres"
    center: "Subdirección para el Conocimiento del Riesgo"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    page-layout: full
